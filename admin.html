<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · Qurani Life</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--g:#00703A;--gd:#00552C;--side:#0B2418;--side2:#123524;--gold:#E0B415;--gold2:#F2C832;--bg:#F3F5F2;--card:#fff;--ink:#16211B;--muted:#647069;--line:#E3E8E3;--red:#C2410C;--blue:#2563EB;--violet:#7C3AED;--teal:#0D9488;--amber:#D97706;--r:14px;--sh:0 1px 2px rgba(16,40,28,.06),0 8px 24px -16px rgba(16,40,28,.25)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Inter,"Hind Siliguri",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--g)}
.bn{font-family:"Hind Siliguri",Inter,sans-serif}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 80% -10%,#0E5A35 0,transparent 60%),linear-gradient(160deg,#06180F,#0B2A1B 55%,#0F3A25)}
.lbox{width:min(400px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);border-top:5px solid var(--gold)}
.lbox .lg{display:flex;gap:12px;align-items:center;margin-bottom:18px}.lbox img{width:52px;height:58px;object-fit:contain}
.lbox h1{font-size:20px;margin:0}.lbox small{color:var(--muted)}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,112,58,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;background:var(--g);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--gd)}.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--g);color:var(--g)}
.btn.gold{background:var(--gold);color:#1d1600}.btn.red{background:#fff;color:var(--red);border:1.5px solid #F3C7B4}
.btn.wa{background:#25D366}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.err{color:var(--red);font-weight:600;min-height:20px;font-size:13px}
/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:linear-gradient(180deg,var(--side),#0A1F15);color:#CFE1D6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand img{width:38px;height:42px;object-fit:contain;background:#FFF8E6;border-radius:9px;padding:2px}
.brand b{color:#fff;font-size:14px;display:block;line-height:1.2}.brand small{color:var(--gold2);font-size:11px;font-weight:700;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6F8F7E;margin:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#CFE1D6;text-decoration:none;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(224,180,21,.22),rgba(224,180,21,.04));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:none}.nav .ct{margin-left:auto;background:var(--gold);color:#1d1600;border-radius:999px;font-size:11px;padding:0 7px;font-weight:800}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:12px 8px 0;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--g);flex:none;font-size:13px}
.me b{color:#fff;display:block;font-size:13px}.me small{color:#8FB09E;font-size:11.5px}
.me button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.15);color:#CFE1D6;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(243,245,242,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:19px}.top .sub{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}.top .gs{max-width:280px}
.burger{display:none;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer}
.content{padding:22px 26px 60px}
/* cards */
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.c2{grid-template-columns:2fr 1fr}.c11{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}.card h3 small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.kpi{position:relative;overflow:hidden}.kpi .lb{color:var(--muted);font-weight:600;font-size:12.5px}
.kpi .v{font:800 28px/1.15 Inter;margin-top:4px;letter-spacing:-.02em}.kpi .d{font-size:12px;font-weight:700;margin-top:4px}
.kpi .d.up{color:var(--g)}.kpi .d.dn{color:var(--red)}.kpi .d.nt{color:var(--muted)}
.kpi .ico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.kpi .ico svg{width:18px;height:18px}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.9}
/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select{width:auto;min-width:130px}.tools .q{min-width:220px;flex:1;max-width:320px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
th{background:#F7F9F7;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#F6FBF8}
td .nm{font-weight:700}td .sm{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;background:#EEF2EF;color:#3B4A42}
.tag.trial{background:#E6F4EC;color:#0B6B3A}.tag.admission{background:#EAF0FE;color:#1D4ED8}.tag.teacher{background:#F3EAFE;color:#6D28D9}
.tag.wa{background:#E3F8EA;color:#128C4B}
.overdue{color:var(--red);font-weight:700}.today{color:var(--amber);font-weight:700}
.bar{height:7px;background:#EAEFEA;border-radius:9px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#2FB36B);border-radius:9px}
.mini{display:flex;gap:3px}.mini i{width:16px;height:6px;border-radius:3px;background:#E3E8E3}.mini i.d{background:var(--g)}.mini i.c{background:var(--gold)}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow:auto;padding-bottom:8px}
.col{background:#E9EEEA;border-radius:var(--r);padding:10px;min-height:300px}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;align-items:center;gap:6px}.col h4 span{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.col.drop{outline:2px dashed var(--g);outline-offset:-4px}
.kc{background:#fff;border-radius:11px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--sh);cursor:grab;border-left:3px solid var(--line)}
.kc b{display:block}.kc .sm{color:var(--muted);font-size:12px}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(8,20,14,.45);z-index:30;display:none}.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:#fff;z-index:31;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h3{margin:0;font-size:18px}.dh .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.db{padding:16px 20px;overflow:auto;flex:1}
.sect{margin-bottom:18px}.sect h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f2 .full{grid-column:1/-1}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:12px}.tl .it::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px #fff}
.tl .it small{color:var(--muted);display:block;font-size:11.5px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);opacity:0;pointer-events:none;width:min(520px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;z-index:40;padding:20px;transition:.18s;box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 14px}
.cred{background:#F6FBF8;border:1.5px dashed var(--g);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:14px;margin:10px 0}
/* stepper */
.stepper{display:flex;gap:0;margin:6px 0 4px;overflow-x:auto;padding-bottom:4px}
.st{flex:1;min-width:96px;text-align:center;position:relative}
.st::after{content:"";position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:3px;background:#E3E8E3}
.st:last-child::after{display:none}.st.d::after{background:var(--g)}
.st i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:#EEF2EF;color:var(--muted);font-style:normal;font-weight:800;font-size:13px;border:2px solid #E3E8E3;position:relative;z-index:1}
.st.d i{background:var(--g);border-color:var(--g);color:#fff}.st.c i{background:#FFF6D6;border-color:var(--gold);color:#7A5B00}
.st span{font-size:11.5px;font-weight:700;display:block;line-height:1.3}.st small{color:var(--muted);font-size:11px}
/* charts */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:120px 1fr 42px;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px}
.hb .t{height:10px;background:#EEF2EF;border-radius:6px;overflow:hidden}.hb .t i{display:block;height:100%;border-radius:6px}
.hb b{text-align:right}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B2418;color:#fff;padding:10px 16px;border-radius:11px;font-weight:700;z-index:60;box-shadow:var(--sh)}
.toast.bad{background:var(--red)}
.lst .row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.lst .row:last-child{border:0}
.lst .row .sm{color:var(--muted);font-size:12px}
.chk{display:flex;gap:14px;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center;font-weight:600}.chk input{width:auto}
.note{background:#FFF8E1;border:1px solid #F2DB8A;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
@media(max-width:1200px){.k6{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;z-index:35;width:260px;transform:translateX(-100%);transition:.25s}.side.on{transform:none}.burger{display:block}.k4{grid-template-columns:repeat(2,1fr)}.c11,.c3{grid-template-columns:1fr}.top{padding:12px 14px}.content{padding:16px 14px 60px}.top .gs{display:none}}
@media(max-width:560px){.k6,.k4{grid-template-columns:1fr 1fr}.f2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{font-weight:700;margin-top:4px}}
</style>
</head>

 <form class="lbox" id="loginForm" autocomplete="on">

 </form>

/* ---------- data helpers ---------- */
function parseTs(s){if(!s)return null;s=String(s);let d=new Date(s);if(!isNaN(d))return d;
 const m=s.match(/(\d{1,4})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);if(!m)return null;
 let a=+m[1],b=+m[2],c=+m[3];let y,mo,da;if(a>31){y=a;mo=b;da=c}else{y=c<100?2000+c:c;if(a>12){da=a;mo=b}else{mo=a;da=b}}
 return new Date(y,mo-1,da,+(m[4]||0),+(m[5]||0))}
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmt=d=>d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
const fmtD=d=>d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const ago=d=>{if(!d)return'';const s=(Date.now()-d)/1000;if(s<3600)return Math.max(1,Math.round(s/60))+' মিনিট আগে';if(s<86400)return Math.round(s/3600)+' ঘণ্টা আগে';return Math.round(s/86400)+' দিন আগে'};
const pick=(o,keys)=>{const ks=Object.keys(o).filter(k=>!k.startsWith('_'));for(const x of keys){const k=ks.find(k=>{const lk=k.toLowerCase();return (lk===x||lk.includes(x))&&!(x==='name'&&/father|guardian|teacher/.test(lk))&&String(o[k]).trim()});if(k)return o[k]}return ''};
const nameOf=o=>pick(o,['student full name','student name','full name','name'])||'(নাম নেই)';
const phoneOf=o=>pick(o,['whatsapp','phone','mobile']);
const digits=s=>String(s||'').replace(/[^\d]/g,'');
const can=p=>USER&&(USER.role==='superadmin'||(USER.perms||[]).includes(p));
const isSA=()=>USER&&USER.role==='superadmin';

 }));

}

/* ---------- charts (SVG) ---------- */
function spark(vals,col){const w=110,h=36,mx=Math.max(1,...vals);const pts=vals.map((v,i)=>[(i/(vals.length-1||1))*w,h-3-(v/mx)*(h-8)]);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return `<svg class="spark" width="${w}" height="${h}"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2"/></svg>`}
function stackBars(days,series){
 const W=640,H=210,P=28,bw=(W-P)/days.length;let mx=1;days.forEach((d,i)=>{let s=0;series.forEach(se=>s+=se.v[i]);mx=Math.max(mx,s)});
 const nice=Math.max(2,Math.ceil(mx/2)*2);let g='';
 for(let k=0;k<=4;k++){const y=H-20-(H-30)*k/4;g+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="#EEF2EF"/><text x="${P-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#8A968F">${Math.round(nice*k/4)}</text>`}
 days.forEach((d,i)=>{let y=H-20;series.forEach(se=>{const h=(H-30)*se.v[i]/nice;if(h>0){g+=`<rect x="${(P+i*bw+bw*.18).toFixed(1)}" y="${(y-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${se.c}"><title>${d.l}: ${se.n} ${se.v[i]}</title></rect>`;y-=h}});
  if(i%5===0||i===days.length-1)g+=`<text x="${P+i*bw+bw/2}" y="${H-5}" font-size="10" text-anchor="middle" fill="#8A968F">${d.l}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`}
function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0)||1;let a0=-Math.PI/2,g='';const R=58,r=38,cx=70,cy=70;
 parts.forEach(p=>{if(!p.v)return;const a1=a0+2*Math.PI*p.v/tot;const big=a1-a0>Math.PI?1:0;
  if(p.v===tot){g+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p.c}" stroke-width="${R-r}"/>`}else{
  const P=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];const [x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r),[x3,y3]=P(a0,r);
  g+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z" fill="${p.c}"><title>${p.n}: ${p.v}</title></path>`}a0=a1});
 return `<div style="display:flex;gap:16px;align-items:center"><svg width="140" height="140">${g}<text x="70" y="68" text-anchor="middle" font-size="20" font-weight="800" fill="#16211B">${parts.reduce((a,p)=>a+p.v,0)}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#8A968F">মোট</text></svg><div>${parts.map(p=>`<div style="margin:6px 0;font-size:12.5px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.c};margin-right:6px"></i>${p.n} <b>${p.v}</b> <span style="color:#8A968F">(${Math.round(p.v/tot*100)}%)</span></div>`).join('')}</div></div>`}
function hbars(rows,col){const mx=Math.max(1,...rows.map(r=>r.v));return rows.length?rows.map(r=>`<div class="hb"><span title="${esc(r.n)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.n)}</span><div class="t"><i style="width:${r.v/mx*100}%;background:${r.c||col}"></i></div><b>${r.v}</b></div>`).join(''):'<div class="sm" style="color:var(--muted)">এখনো তথ্য নেই</div>'}

function credBox(id,pw,s){return `<div class="cred">Student ID: <b>${esc(id)}</b><br>পাসওয়ার্ড: <b>${esc(pw)}</b></div><p class="sm" style="color:var(--muted)">শিক্ষার্থীর প্রোফাইলে (শুধু Super Admin) এই তথ্য সবসময় দেখা যাবে।</p>${credBtns(id,pw,s)}<div style="margin-top:10px"><button class="btn ghost sm" data-close type="button">বন্ধ</button></div>`}
function passModal(name,cb){openModal(`<h3>🔑 ${esc(name)}-এর নতুন পাসওয়ার্ড</h3><form id="pmf"><label class="fld"><span>নতুন পাসওয়ার্ড (খালি রাখলে নিজে থেকে তৈরি হবে)</span><input name="np" minlength="6" placeholder="কমপক্ষে ৬ অক্ষর"></label><p class="sm" style="color:var(--muted)">পুরনো পাসওয়ার্ড আর কাজ করবে না।</p><div style="display:flex;gap:8px"><button class="btn">সেট করুন</button><button class="btn ghost" type="button" data-close>বাতিল</button></div></form>`);
 $('#pmf').onsubmit=e=>{e.preventDefault();cb(e.target.np.value.trim())}}
function convertModal(l){const s={Name:l._name,WhatsApp:l._phone,Country:l._country,Course:l._course,Guardian:pick(l,['guardian','father','parent']),Email:pick(l,['email']),Age:pick(l,['age']),Gender:pick(l,['gender']),'Class type':pick(l,['class type'])==='Batch'?'Batch':'One-to-one','Batch ID':String(pick(l,['preferred batch'])||'').split(' · ')[0],Notes:[pick(l,['preferred time','preferred slot'])].filter(Boolean).map(x=>'পছন্দের সময়: '+x).join('')};
 openModal(`<h3>🎓 শিক্ষার্থী অ্যাকাউন্ট তৈরি</h3><form id="cf">${stuForm(s)}<p class="err" id="cerr"></p><div style="display:flex;gap:8px"><button class="btn">অ্যাকাউন্ট তৈরি করুন</button><button class="btn ghost" type="button" data-close>বাতিল</button></div></form>`);
 $('#cf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;const f=stuObj(e.target);const r=await api('convert',{tab:l._tab,row:l._row,fields:f});b.disabled=false;

function pipeline(){const r=LEADS.filter(l=>l._tab!=='teacher'||true);
 $('#view').innerHTML=`<p class="sm" style="color:var(--muted);margin-top:0">কার্ড ধরে অন্য কলামে টেনে নিলেই অবস্থা বদলে যাবে। কার্ডে ক্লিক করলে বিস্তারিত।</p><div class="kb">${STATUSES.map(s=>{const it=r.filter(l=>l._status===s);return `<div class="col" data-st="${s}"><h4><i style="width:9px;height:9px;border-radius:50%;background:${SCOL[s]};display:inline-block"></i>${s}<span>${it.length}</span></h4>${it.slice(0,80).map(l=>`<div class="kc" draggable="true" data-lead="${l._tab}:${l._row}" style="border-left-color:${TCOL[l._tab]}"><b>${esc(l._name)}</b><div class="sm">${TYPES[l._tab]} · ${esc(l._country||'')}</div><div class="sm">${esc(l['Assigned to']||'কেউ দায়িত্বে নেই')} · ${ago(l._ts)}</div></div>`).join('')}</div>`}).join('')}</div>`;
 $$('.kc').forEach(c=>c.addEventListener('dragstart',e=>e.dataTransfer.setData('text',c.dataset.lead)));
 $$('.col').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop')});col.addEventListener('dragleave',()=>col.classList.remove('drop'));
  col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('drop');const [t,row]=e.dataTransfer.getData('text').split(':');const l=LEADS.find(x=>x._tab===t&&String(x._row)===row);if(!l||l._status===col.dataset.st)return;
   const old=l._status;l._status=l.Status=col.dataset.st;pipeline();const res=await api('leadUpdate',{tab:t,row,Status:col.dataset.st});
   if(res.ok){const o=D[t].find(x=>String(x._row)===row);if(o)o.Status=col.dataset.st;toast('অবস্থা: '+col.dataset.st);navHtml()}else{l._status=l.Status=old;pipeline();toast(em(res.error),1)}})})}

function followups(){const t0=today0(),t1=new Date(+t0+864e5),open=LEADS.filter(l=>!['ভর্তি হয়েছে','বাতিল'].includes(l._status));
 const g=[['⏰ সময় পেরিয়ে গেছে',open.filter(l=>l._fu&&l._fu<t0)],['📅 আজ',open.filter(l=>l._fu&&l._fu>=t0&&l._fu<t1)],['🗓 সামনে',open.filter(l=>l._fu&&l._fu>=t1).sort((a,b)=>a._fu-b._fu)],['🆕 নতুন, তারিখ ঠিক হয়নি',open.filter(l=>!l._fu&&l._status==='নতুন')]];
 $('#view').innerHTML=`<div class="grid c11">${g.map(([t,a])=>`<div class="card lst"><h3>${t}<small>${a.length} টি</small></h3>${a.map(l=>`<div class="row" data-lead="${l._tab}:${l._row}" style="cursor:pointer"><span class="tag ${l._tab}">${TYPES[l._tab]}</span><div><b>${esc(l._name)}</b><div class="sm">${esc(l._phone)} · ${esc(l['Assigned to']||'কেউ দায়িত্বে নেই')}</div></div><span style="margin-left:auto">${fuCell(l)}</span></div>`).join('')||'<div class="sm" style="color:var(--muted)">কিছু নেই</div>'}</div>`).join('')}</div>`}

 const dr=()=>{const a=f();$('#scount').textContent=a.length+' জন';$('#stb').innerHTML=a.length?a.map(s=>{const st=+s.Stage||1,p=+s['Stage progress']||0;return `<tr data-stu="${esc(s.ID)}"><td><b>${esc(s.ID)}</b></td><td><div class="nm">${esc(s.Name)}</div><div class="sm">${s['Class type']==='Batch'?`<span class="tag" style="background:#FFF4CC;color:#7A5B00">ব্যাচ ${esc(s['Batch ID'])}</span> `:''}${esc(s.Country||'')}</div></td>${isSA()?`<td><code>${esc(s.Password||'—')}</code></td>`:''}<td>${esc(s.Course)}</td><td>${esc(s.Teacher||'—')}</td><td><span class="sm">${esc(schedText(s)||'—')}</span></td><td><div class="mini">${stg.map((x,i)=>`<i class="${i+1<st?'d':i+1===st?'c':''}" title="${esc(x.bn)}"></i>`).join('')}</div><div class="sm" style="margin-top:3px">${st}. ${esc(stageName(st))}</div></td><td><div class="bar"><i style="width:${p}%"></i></div><div class="sm">${p}%${s['Current lesson']?' · '+esc(s['Current lesson']):''}</div></td><td><b>${stuOverall(s)}%</b></td><td><span class="pill" style="color:${{Active:'#00703A',Paused:'#D97706',Completed:'#2563EB',Left:'#9CA3AF'}[s.Status||'Active']}">${SSTB[s.Status||'Active']}</span></td><td><span class="sm">${s['Last login']?ago(parseTs(s['Last login'])):'কখনো না'}</span></td></tr>`}).join(''):`<tr><td colspan="11" style="text-align:center;padding:30px;color:var(--muted)">কোনো শিক্ষার্থী নেই। লিড থেকে "শিক্ষার্থী বানান" বা "+ নতুন শিক্ষার্থী" দিয়ে যোগ করুন।</td></tr>`};
 [['#sq','q','input'],['#ss','st','change'],['#sg','stage','change'],['#stc','teacher','change']].forEach(([id,k,ev])=>$(id).addEventListener(ev,e=>{SF[k]=e.target.value;dr()}));
 $('#scsv').onclick=()=>{const rows=f();const keys=Object.keys(rows[0]||{}).filter(k=>!k.startsWith('_'));const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const s='﻿'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>r[k]).map(q).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='qurani-life-students.csv';a.click()};
 $('#sadd').onclick=()=>{openModal(`<h3>নতুন শিক্ষার্থী</h3><form id="naf">${stuForm()}<p class="err" id="naerr"></p><div style="display:flex;gap:8px"><button class="btn">তৈরি করুন</button><button class="btn ghost" type="button" data-close>বাতিল</button></div></form>`);
  $('#naf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;const fo=stuObj(e.target);const r=await api('studentSave',{fields:fo});b.disabled=false;if(r.ok){$('#modal').innerHTML=`<h3>✅ শিক্ষার্থী যোগ হয়েছে</h3>${credBox(r.id,r.password,fo)}`;load()}else $('#naerr').textContent=em(r.error)}};
 dr()}

   <h2 style="margin:8px 0 2px;font-size:26px">${esc(s.Name)}</h2><div style="color:var(--muted)">${esc(s.ID)} · ${esc(s.Course||'')} · ${st}. ${esc(stageName(st))} (${+s['Stage progress']||0}%)</div>${s['Current lesson']?`<div style="margin-top:4px">বর্তমান পাঠ: <b>${esc(s['Current lesson'])}</b></div>`:''}</div>
   <div style="text-align:right"><div style="font:800 34px/1.1 Inter;color:#00552C">${tBD(c.start)}</div><div style="color:var(--muted)">${dBD(c.start)} · ${(c.end-c.start)/6e4} মিনিট</div><div style="font-weight:800;color:${live?'#C2410C':'#B45309'};margin-top:6px;font-size:16px">${until(c.start)}</div></div></div>
   <div style="margin-top:14px"><button class="btn sm" data-tstu="${esc(s.ID)}" type="button">অগ্রগতি আপডেট করুন</button></div></div>`
  :`<div class="card" style="display:flex;gap:14px;align-items:center;cursor:pointer" data-tstu="${esc(s.ID)}"><div style="width:62px;text-align:center;border-right:1px solid var(--line);padding-right:12px"><div style="font:800 16px Inter;color:#00552C">${tBD(c.start)}</div><div class="sm" style="color:var(--muted)">${c.start.toLocaleDateString(LOC(),{weekday:'short',timeZone:'Asia/Dhaka'})}</div></div><div style="flex:1"><b>${esc(s.Name)}</b><div class="sm" style="color:var(--muted)">${esc(s.Course||'')} · ${st}. ${esc(stageName(st))}</div></div><div class="sm" style="font-weight:700;color:#B45309">${until(c.start)}</div></div>`};
 const noSched=list.filter(s=>!s['Class days']||!s['Class start']);
 $('#view').innerHTML=`<div class="grid c2"><div><h3 style="margin:0 0 12px">সামনের ৫টি ক্লাস</h3>${nx.length?`<div class="grid" style="gap:12px">${nx.map(card).join('')}</div>`:'<div class="empty">কোনো ক্লাসের সময় ঠিক করা নেই। অ্যাডমিন শিক্ষার্থীর প্রোফাইলে দিন ও সময় দিলে এখানে দেখাবে।</div>'}
  ${noSched.length?`<p class="sm" style="color:var(--muted);margin-top:12px">${noSched.length} জন শিক্ষার্থীর ক্লাসের সময় এখনো ঠিক করা হয়নি।</p>`:''}</div>
  <div class="grid" style="gap:16px;align-content:start">${academyBox()}<div class="card"><h3>এক নজরে</h3><dl class="kv"><dt>আমার শিক্ষার্থী</dt><dd><b>${list.length}</b> জন</dd><dt>চলমান</dt><dd>${list.filter(s=>(s.Status||'Active')==='Active').length} জন</dd><dt>সময় দেখানো হচ্ছে</dt><dd>বাংলাদেশ সময়</dd></dl></div></div></div>`;
 clearInterval(window._ct);window._ct=setInterval(()=>{if(PAGE==='classes'&&!$('#drawer').classList.contains('on'))classes()},60000)}
function mystudents(){const list=D.students||[];
 $('#view').innerHTML=`<div class="grid c3">${list.map(s=>{const st=+s.Stage||1,p=+s['Stage progress']||0;return `<div class="card" style="cursor:pointer" data-tstu="${esc(s.ID)}"><div style="display:flex;justify-content:space-between;gap:8px"><div><b style="font-size:16px">${esc(s.Name)}</b><div class="sm" style="color:var(--muted)">${esc(s.ID)} · ${esc(s.Course||'')}</div></div><span class="pill" style="color:${{Active:'#00703A',Paused:'#D97706',Completed:'#2563EB',Left:'#9CA3AF'}[s.Status||'Active']}">${SSTB[s.Status||'Active']}</span></div>
  <div class="mini" style="margin:12px 0 6px">${(D.stages||[]).map((x,i)=>`<i class="${i+1<st?'d':i+1===st?'c':''}" style="flex:1"></i>`).join('')}</div><div class="sm">${st}. ${esc(stageName(st))} · <b>${p}%</b>${s['Current lesson']?' · '+esc(s['Current lesson']):''}</div><div class="sm" style="color:var(--muted);margin-top:6px">🗓 ${esc(schedText(s)||'ক্লাসের সময় ঠিক হয়নি')}</div></div>`}).join('')||'<div class="empty">এখনো কোনো শিক্ষার্থী আপনার কাছে দেওয়া হয়নি।</div>'}</div><div style="margin-top:16px">${academyBox()}</div>`}
document.addEventListener('click',e=>{const r=e.target.closest('[data-tstu]');if(r&&isT())openTStudent(r.dataset.tstu)});
function openTStudent(id){const s=(D.students||[]).find(x=>x.ID===id);if(!s)return;const st=+s.Stage||1,p=+s['Stage progress']||0;
 const hist=(D.progress||[]).filter(x=>x['Student ID']===id).reverse();const lead=(D.myLeads||[]).find(l=>l._student===id);
 const lkv=lead?Object.keys(lead).filter(k=>!k.startsWith('_')&&!['Status','Assigned to','Follow-up','Sent via'].includes(k)&&String(lead[k]).trim()).map(k=>`<dt>${esc(k)}</dt><dd>${esc(lead[k])}</dd>`).join(''):'';
 openDrawer(`<div class="dh"><div><span class="tag">${esc(s.ID)}</span><h3>${esc(s.Name)}</h3><div class="sm" style="color:var(--muted)">${esc(s.Course||'')} ${s.Age?'· বয়স '+esc(s.Age):''} ${s.Country?'· '+esc(s.Country):''}</div><div class="sm" style="margin-top:4px">🗓 ${esc(schedText(s)||'ক্লাসের সময় ঠিক হয়নি')}</div></div><button class="x" data-close>×</button></div>
 <div class="db"><div class="sect card" style="box-shadow:none"><h4>শেখার পথ · মোট ${stuOverall(s)}%</h4>${stepper(st,p)}</div>
  <div class="sect"><h4>অগ্রগতি আপডেট করুন</h4><form id="pf" class="f2">
   <label class="fld"><span>স্টেজ</span><select name="stage">${(D.stages||[]).map((x,i)=>`<option value="${i+1}" ${i+1===st?'selected':''}>${i+1}. ${esc(x.bn)}</option>`).join('')}</select></label>
   <label class="fld"><span>এই স্টেজে অগ্রগতি: <b id="pv">${p}%</b></span><input type="range" name="pct" min="0" max="100" step="5" value="${p}" style="padding:0;border:0;box-shadow:none"></label>
   <label class="fld"><span>বর্তমান পাঠ</span><input name="lesson" value="${esc(s['Current lesson'])}" placeholder="যেমন: সবক ১২, সূরা মুলক"></label>
   <label class="fld"><span>নোট (শিক্ষার্থী দেখতে পাবে)</span><input name="note" placeholder="যেমন: মাখরাজ ভালো হয়েছে"></label>
   <div class="full"><button class="btn">অগ্রগতি সেভ করুন</button></div></form></div>
  <div class="sect"><h4>অগ্রগতির ইতিহাস</h4><div class="tl">${hist.slice(0,30).map(h=>`<div class="it"><b>${esc(stageName(+h.Stage))}</b> · ${esc(h['Stage progress'])}% ${h.Lesson?'· '+esc(h.Lesson):''}${h.Note?`<div>${esc(h.Note)}</div>`:''}<small>${esc(h.By)} · ${fmt(parseTs(h.Time))}</small></div>`).join('')||'<div class="sm" style="color:var(--muted)">এখনো কোনো আপডেট নেই</div>'}</div></div>
  ${lkv?`<div class="sect"><h4>ভর্তির সময়ের তথ্য</h4><dl class="kv">${lkv}</dl></div>`:''}
  <div class="sect">${academyBox()}</div></div>`);
 const pf=$('#pf');pf.pct.oninput=e=>$('#pv').textContent=e.target.value+'%';
 pf.onsubmit=async e=>{e.preventDefault();const b=pf.querySelector('.btn');b.disabled=true;const f=formObj(pf);const r=await api('studentProgress',{id,...f});b.disabled=false;
  if(r.ok){Object.assign(s,{Stage:f.stage,'Stage progress':f.pct,'Current lesson':f.lesson});(D.progress=D.progress||[]).push({Time:new Date().toISOString(),'Student ID':id,Stage:f.stage,'Stage progress':f.pct,Lesson:f.lesson,Note:f.note,By:USER.name});toast('অগ্রগতি সেভ হয়েছে');openTStudent(id);go()}else toast(em(r.error),1)}}

/* ---------- ACTIVITY ---------- */
function activity(){const L=D.log||[];$('#view').innerHTML=`<div class="tw"><table><thead><tr><th>সময়</th><th>কে</th><th>কাজ</th><th>বিস্তারিত</th></tr></thead><tbody>${L.map(x=>`<tr style="cursor:default"><td><span class="sm">${fmt(parseTs(x.Time))}</span></td><td><b>${esc(x.User)}</b></td><td><span class="tag">${esc(x.Action)}</span></td><td style="white-space:normal">${esc(x.Details)}</td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center;padding:30px">এখনো কিছু নেই</td></tr>'}</tbody></table></div>`}

/* ---------- SETTINGS ---------- */
function settings(){$('#view').innerHTML=`<div class="grid c11"><div class="card"><h3>পাসওয়ার্ড বদলান</h3><form id="cpf">
 <label class="fld"><span>বর্তমান পাসওয়ার্ড</span><input type="password" name="oldPass" required autocomplete="current-password"></label>
 <label class="fld"><span>নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</span><input type="password" name="newPass" minlength="8" required autocomplete="new-password"></label>
 <label class="fld"><span>আবার লিখুন</span><input type="password" name="again" minlength="8" required autocomplete="new-password"></label><p class="err" id="cperr"></p><button class="btn">বদলান</button></form></div>
 <div class="card"><h3>আপনার অ্যাকাউন্ট</h3><dl class="kv"><dt>নাম</dt><dd>${esc(USER.name)}</dd><dt>Username</dt><dd>${esc(USER.username)}</dd><dt>ভূমিকা</dt><dd>${ROLE[USER.role]}</dd><dt>অনুমতি</dt><dd>${isSA()?'সব':isT()?'নিজের শিক্ষার্থী ও ক্লাস':(USER.perms||[]).map(p=>PERMN[p]).join(', ')}</dd></dl>
 ${isSA()?`<h3 style="margin-top:18px">স্টেজের তালিকা</h3><p class="sm" style="color:var(--muted)">শেখার ধাপগুলো Google Sheet-এর <b>Stages</b> ট্যাবে রাখা। সেখানে বদলালে এখানে আর শিক্ষার্থীর প্রোফাইলে বদলে যাবে।</p><ol style="margin:0;padding-left:18px">${(D.stages||[]).map(s=>`<li>${esc(s.bn)} <span class="sm" style="color:var(--muted)">(${esc(s.en)})</span></li>`).join('')}</ol><a class="btn ghost sm" style="margin-top:10px" target="_blank" href="${esc(D.sheet)}">Google Sheet খুলুন ↗</a>`:''}</div></div>`;
 $('#cpf').onsubmit=async e=>{e.preventDefault();const f=formObj(e.target);if(f.newPass!==f.again){$('#cperr').textContent='দুটো পাসওয়ার্ড মেলেনি।';return}const r=await api('changePass',{oldPass:f.oldPass,newPass:f.newPass});if(r.ok){toast('পাসওয়ার্ড বদলানো হয়েছে');e.target.reset();$('#cperr').textContent=''}else $('#cperr').textContent=em(r.error)}}

if(TOKEN)start();
</script>
</body>
</html>
