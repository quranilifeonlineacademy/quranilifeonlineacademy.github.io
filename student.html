<style>
[hidden]{display:none!important}
:root{--g:#00703A;--gd:#00552C;--deep:#0B2A1B;--gold:#E0B415;--gold2:#F2C832;--bg:#F5F2E9;--card:#fff;--ink:#14201A;--muted:#5E6B63;--line:#E6E0CF;--red:#C2410C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.6 "Hind Siliguri",Inter,sans-serif}
button,input{font:inherit}a{color:var(--g)}
input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,112,58,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--g);color:#fff;text-decoration:none}
.btn:hover{background:var(--gd)}.btn:disabled{opacity:.6}.btn.ghost{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.wa{background:#25D366}.btn.gold{background:var(--gold);color:#1d1600}
.err{color:var(--red);font-weight:600;min-height:22px;margin:6px 0}
.lwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 85% -10%,#14703F 0,transparent 60%),linear-gradient(160deg,#06180F,#0B2A1B 60%,#0F3A25)}
.lbox{width:min(420px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);border-top:5px solid var(--gold);text-align:center}
.lbox img{width:84px}.lbox h1{margin:6px 0 2px;font-size:22px}.lbox p{color:var(--muted);margin:0 0 18px}
.lbox label{display:block;text-align:left;margin-bottom:12px}.lbox label span{display:block;font-weight:600;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.lbox .ay{font-family:Amiri,serif;font-size:22px;color:var(--g);margin:4px 0 0;direction:rtl}
header{background:linear-gradient(120deg,var(--deep),var(--g));color:#fff;padding:14px 20px}
.hd{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd img{width:44px;height:50px;object-fit:contain;background:#FFF8E6;border-radius:10px;padding:3px}
.hd b{display:block;line-height:1.2}.hd small{color:var(--gold2);font-weight:700;font-size:12px}
.hd .sp{flex:1}.hd button,.hd a{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none;font-weight:600;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.hello{background:linear-gradient(135deg,#0B2A1B,#00703A);color:#fff;border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;box-shadow:0 30px 60px -30px rgba(0,60,30,.6);position:relative;overflow:hidden}
.hello::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,200,50,.25),transparent 70%)}
.hello h1{margin:0;font-size:24px}.hello p{margin:4px 0 0;color:#CFE6D8}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;font-size:13.5px}
.ring{position:relative;width:130px;height:130px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 28px Inter;color:#fff}
.ring small{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12px;color:#CFE6D8}
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line);box-shadow:0 20px 40px -30px rgba(0,60,30,.35);margin-top:18px}
.card h2{margin:0 0 14px;font-size:19px}
.path{display:grid;gap:12px}
.stp{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;position:relative}
.stp:not(:last-child)::before{content:"";position:absolute;left:25px;top:52px;bottom:-14px;width:3px;background:#E6E0CF;border-radius:3px}
.stp.d:not(:last-child)::before{background:var(--g)}
.stp .n{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 18px Inter;background:#F1EEE3;color:#9A9384;border:3px solid #E6E0CF;position:relative;z-index:1}
.stp.d .n{background:var(--g);border-color:var(--g);color:#fff}
.stp.c .n{background:#FFF6D6;border-color:var(--gold);color:#7A5B00;box-shadow:0 0 0 6px rgba(224,180,21,.18)}
.stp .b{background:#FBFAF5;border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.stp.c .b{background:#fff;border:2px solid var(--gold);box-shadow:0 14px 30px -20px rgba(160,120,0,.6)}
.stp.u .b{opacity:.65}
.stp h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stp h3 em{font-style:normal;font-size:12px;border-radius:999px;padding:1px 10px;font-weight:700}
.stp.d h3 em{background:#E3F4EA;color:var(--g)}.stp.c h3 em{background:#FFF1BF;color:#7A5B00}.stp.u h3 em{background:#EEE;color:#888}
.stp p{margin:2px 0 0;color:var(--muted);font-size:14px}
.bar{height:10px;background:#EEEADD;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#2FB36B);border-radius:9px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.tl{border-left:3px solid #E6E0CF;margin-left:8px;padding-left:16px}
.tl .it{position:relative;margin-bottom:14px}.tl .it::before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px #fff}
.tl small{display:block;color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50}
.toast.bad{background:var(--red)}
@media(max-width:760px){.hello{grid-template-columns:1fr}.ring{margin:0 auto}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{font-weight:700}}

.g2{grid-template-columns:1fr 1fr!important}@media(max-width:820px){.g2{grid-template-columns:1fr!important}}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.th h2{margin:0}
.att{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}.att.sm{font-size:11.5px;padding:1px 8px}
.today{border-top:4px solid var(--gold)}.today .dt{color:var(--muted);margin:0 0 12px;font-size:14px}
.lgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.lgrid2>div{background:#F7FAF8;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.lgrid2 small{display:block;color:var(--muted);font-size:12px}.lgrid2 b{font-size:15.5px}
.hw,.tn{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14.5px}.hw{background:#FFF8E1}.tn{background:#E9F5EE}
.stars{color:#E0B415;letter-spacing:1px}.stars i{color:#D9DED9;font-style:normal}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}.kp>div{text-align:center;background:#F7FAF8;border:1px solid var(--line);border-radius:12px;padding:10px 4px}.kp b{display:block;font-size:22px;color:var(--gd)}.kp small{color:var(--muted);font-size:12px}
@media(max-width:420px){.kp{grid-template-columns:repeat(2,1fr)}}
.dots{display:flex;flex-wrap:wrap;gap:5px}.dots i{width:24px;height:24px;border-radius:7px;color:#fff;font:700 12px/24px Inter;text-align:center;font-style:normal}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.btn.sm{padding:6px 12px;font-size:13px}
.rcwrap{position:fixed;inset:0;background:rgba(5,20,14,.6);z-index:80;display:grid;place-items:center;padding:14px;overflow:auto}
.rcbox{background:#fff;border-radius:18px;max-width:720px;width:100%;padding:18px;max-height:94vh;overflow:auto}
.rctools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.rctools select{flex:1;min-width:140px;padding:9px;border:1.5px solid var(--line);border-radius:10px}
.rc{border:2px solid var(--gold);border-radius:16px;padding:20px}.rch{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:12px}.rch img{width:54px;height:60px;object-fit:contain}.rch b{display:block;font-size:18px;color:var(--gd)}.rch small{color:var(--muted)}
.rc h3{margin:14px 0 6px;font-size:15.5px;color:var(--gd)}.rc ul{margin:0;padding-left:18px}.rcf{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
@media print{body>*:not(.rcwrap){display:none!important}.rcwrap{position:static;background:none;padding:0}.rcbox{max-height:none;box-shadow:none;padding:0}.rctools{display:none}}
</style>

<body>
<div class="lwrap" id="lv">
 <form class="lbox" id="lf">
  <img src="logo.png" alt="Qurani Life">
  <p class="ay">رَبِّ زِدْنِي عِلْمًا</p>
  <h1>অভিভাবক ও শিক্ষার্থী পোর্টাল</h1>

 </form>
</div>

<div id="app" hidden>
 <header><div class="hd"><img src="logo.png" alt=""><div><b>Qurani Life Online Academy</b><small>অভিভাবক ও শিক্ষার্থী পোর্টাল</small></div><span class="sp"></span><a href="index.html">ওয়েবসাইট</a><button id="out" type="button">বের হন</button></div></header>
 <main id="view"></main>
</div>

<script src="config.js"></script>
<script>
const API=(window.QL_CONFIG&&QL_CONFIG.API_URL)||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK='';try{TOK=localStorage.getItem('qlStuTok')||''}catch(e){}
const toast=(m,b)=>{const t=document.createElement('div');t.className='toast'+(b?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
const post=d=>fetch(API,{method:'POST',body:new URLSearchParams(d)}).then(r=>r.json());
const bnNum=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function parseTs(s){if(!s)return null;let d=new Date(s);if(!isNaN(d))return d;const m=String(s).match(/(\d{1,4})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2}))?/);if(!m)return null;let a=+m[1],b=+m[2],c=+m[3],y,mo,da;if(a>31){y=a;mo=b;da=c}else{y=c<100?2000+c:c;if(a>12){da=a;mo=b}else{mo=a;da=b}}return new Date(y,mo-1,da,+(m[4]||0),+(m[5]||0))}
const fmtD=d=>d?d.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'}):'';
const BD=6*3600e3,DAYC={Sat:6,Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5};
function nextClass(p){const ds=String(p['Class days']||'').split(',').filter(Boolean);if(!ds.length||!/^\d{1,2}:\d{2}/.test(p['Class start']||''))return null;const [h,m]=p['Class start'].split(':').map(Number),dur=(+p.Duration||30)*6e4,now=Date.now(),b=new Date(now+BD);
 for(let o=0;o<9;o++){const st=Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate()+o,h,m)-BD;if(ds.some(x=>DAYC[x]===new Date(st+BD).getUTCDay())&&st+dur>now)return {start:new Date(st),end:new Date(st+dur)}}return null}
const tLocal=d=>d.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'}),tBD=d=>d.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Dhaka'});
const until=d=>{let m=Math.round((d-Date.now())/6e4);if(m<=0)return 'এখন ক্লাস চলছে';const dd=Math.floor(m/1440),hh=Math.floor(m%1440/60),mm=m%60;return (dd?bnNum(dd)+' দিন ':'')+(hh?bnNum(hh)+' ঘণ্টা ':'')+(dd?'':bnNum(mm)+' মিনিট')+' পর'};
const ERR={'wrong login':'Student ID বা পাসওয়ার্ড ভুল।',locked:'অনেকবার ভুল হয়েছে, ১৫ মিনিট পর চেষ্টা করুন।','wrong old password':'বর্তমান পাসওয়ার্ড ভুল।','too short':'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।'};

$('#lf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;$('#lerr').textContent='';
 try{const r=await post({action:'studentLogin',id:$('#sid').value.trim(),password:$('#spw').value});
  if(r.ok){TOK=r.token;try{localStorage.setItem('qlStuTok',TOK)}catch(x){}show(r.student)}else $('#lerr').textContent=ERR[r.error]||'সমস্যা হয়েছে, আবার চেষ্টা করুন।'}
 catch(x){$('#lerr').textContent='ইন্টারনেট সংযোগে সমস্যা।'}b.disabled=false};
$('#out').onclick=()=>{post({action:'logout',token:TOK}).catch(()=>{});try{localStorage.removeItem('qlStuTok')}catch(e){}location.reload()};


const ATT={Present:['উপস্থিত','#00703A','✓'],Late:['দেরিতে','#D97706','◷'],Absent:['অনুপস্থিত','#C0392B','✕'],Leave:['ছুটি','#6B7280','–']};
const stars=n=>{n=+n||0;return n?`<span class="stars">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`:''};
const dLong=s=>{const d=parseTs(s);return d?d.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'}):esc(s)};
const curMonth=()=>new Date(Date.now()+BD).toISOString().slice(0,7);
const mName=m=>new Date(m+'-15').toLocaleDateString('bn-BD',{month:'long',year:'numeric'});
function mStats(C,m){const L=C.filter(x=>String(x.date).slice(0,7)===m);const c={Present:0,Late:0,Absent:0,Leave:0};L.forEach(x=>c[x.att in c?x.att:'Present']++);const r=L.filter(x=>x.rating);return {L,c,tot:L.length,pct:L.length?Math.round((c.Present+c.Late)/L.length*100):null,avg:r.length?(r.reduce((a,x)=>a+x.rating,0)/r.length):0}}
function extra(S){const C=S.classes||[],H=S.hadiya||{paid:[]},m=curMonth(),ms=mStats(C,m);const last=C[0];const A=S.academy||{whatsapp:'8801889012156'};
 const paidM=(H.paid||[]).filter(x=>String(x.month||'').slice(0,7)===m);
 const lastCard=last?`<section class="card today"><div class="th"><h2>📖 ${C.length&&String(last.date)===new Date(Date.now()+BD).toISOString().slice(0,10)?'আজকের ক্লাস':'শেষ ক্লাসের রিপোর্ট'}</h2><span class="att" style="--c:${(ATT[last.att]||ATT.Present)[1]}">${(ATT[last.att]||ATT.Present)[0]}</span></div>
  <p class="dt">${dLong(last.date)}${last.by?' · শিক্ষক: '+esc(last.by):''}</p>
  <div class="lgrid2">${last.sabaq?`<div><small>আজকের সবক</small><b>${esc(last.sabaq)}</b></div>`:''}${last.sabqi?`<div><small>সবকি (রিভিশন)</small><b>${esc(last.sabqi)}</b></div>`:''}${last.manzil?`<div><small>মানজিল</small><b>${esc(last.manzil)}</b></div>`:''}${last.rating?`<div><small>কেমন পড়েছে</small><b>${stars(last.rating)}</b></div>`:''}</div>
  ${last.hw?`<div class="hw">📝 <b>বাড়ির কাজ:</b> ${esc(last.hw)}</div>`:''}${last.note?`<div class="tn">💬 <b>শিক্ষকের মন্তব্য:</b> ${esc(last.note)}</div>`:''}</section>`
  :`<section class="card today"><h2>📖 ক্লাস রিপোর্ট</h2><p style="color:var(--muted)">এখনো কোনো ক্লাস রিপোর্ট নেই। প্রতিটি ক্লাস শেষে শিক্ষক রিপোর্ট দিলে এখানে আজকের পড়া, বাড়ির কাজ ও মন্তব্য দেখাবে।</p></section>`;
 const dots=C.slice(0,30).reverse().map(x=>{const a=ATT[x.att]||ATT.Present;return `<i title="${esc(x.date)}: ${a[0]}" style="background:${a[1]}">${a[2]}</i>`}).join('');
 const attCard=`<section class="card"><div class="th"><h2>🗓 ${esc(mName(m))}-এর উপস্থিতি</h2><button class="btn ghost sm" id="rcBtn" type="button">📄 মাসিক রিপোর্ট কার্ড</button></div>
  ${ms.tot?`<div class="kp"><div><b style="color:${ms.pct>=80?'#00703A':ms.pct>=60?'#D97706':'#C0392B'}">${bnNum(ms.pct)}%</b><small>উপস্থিতি</small></div><div><b>${bnNum(ms.tot)}</b><small>মোট ক্লাস</small></div><div><b>${bnNum(ms.c.Present)}</b><small>উপস্থিত</small></div><div><b>${bnNum(ms.c.Absent)}</b><small>অনুপস্থিত</small></div></div>`:'<p style="color:var(--muted)">এ মাসে এখনো কোনো ক্লাস রিপোর্ট নেই।</p>'}
  ${dots?`<div class="dots" aria-label="শেষ ৩০টি ক্লাস">${dots}</div><p class="lg"><span style="--c:#00703A">উপস্থিত</span><span style="--c:#D97706">দেরিতে</span><span style="--c:#C0392B">অনুপস্থিত</span><span style="--c:#6B7280">ছুটি</span></p>`:''}</section>`;
 const hdCard=`<section class="card"><div class="th"><h2>💳 হাদিয়া</h2>${paidM.length?'<span class="att" style="--c:#00703A">এ মাসে পরিশোধিত</span>':(H.fee?'<span class="att" style="--c:#D97706">এ মাসে বাকি</span>':'')}</div>
